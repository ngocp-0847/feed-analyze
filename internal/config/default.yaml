# feed-analyze — cấu hình
# Sửa file này để đổi chủ đề, nguồn tin, model. Kiểm tra nguồn: `fa feeds check`.

# Mô tả bản thân — Claude dùng để cá nhân hoá "vì sao điều này quan trọng với bạn".
profile: |
  Kỹ sư phần mềm làm việc tại Việt Nam, quan tâm AI agent (ứng dụng, hạ tầng, thị trường),
  kinh tế vĩ mô VN & thế giới (lãi suất, tỷ giá, thương mại, chứng khoán), và chính trị/địa chính trị
  ảnh hưởng tới VN. Muốn hiểu chuỗi nhân quả từ sự kiện cụ thể (vi mô) tới xu hướng lớn (vĩ mô).

timezone: Asia/Ho_Chi_Minh

topics:
  - id: ai-agent
    name: AI Agent & AI ứng dụng
    emoji: "🤖"
    description: >
      AI agent, agentic workflow, LLM/model mới, coding agent, công cụ & framework (MCP, SDK),
      hạ tầng AI (chip, datacenter, điện), doanh nghiệp ứng dụng AI, đầu tư/M&A ngành AI,
      chính sách & quản trị AI, tác động của AI lên việc làm và năng suất. Bao gồm AI tại Việt Nam.
    keywords: [AI agent, agentic, LLM, Claude, OpenAI, Gemini, Anthropic, MCP, trí tuệ nhân tạo, Nvidia, GPU, datacenter]

  - id: economy
    name: Kinh tế & Tài chính
    emoji: "📈"
    description: >
      Kinh tế vĩ mô (GDP, lạm phát, việc làm), chính sách tiền tệ (Fed, NHNN, ECB, BoJ, PBoC),
      lãi suất, tỷ giá, thương mại & thuế quan, FDI, chuỗi cung ứng, thị trường chứng khoán/trái phiếu/
      hàng hoá, bất động sản, ngân hàng, doanh nghiệp lớn có tác động hệ thống.
    keywords: [GDP, lạm phát, lãi suất, tỷ giá, Fed, NHNN, thuế quan, xuất khẩu, FDI, VN-Index, trái phiếu, tariff]

  - id: politics
    name: Chính trị & Địa chính trị
    emoji: "🏛️"
    description: >
      Chính trị trong nước VN (Đảng, Quốc hội, Chính phủ, nhân sự, luật & nghị định, cải cách bộ máy),
      quan hệ quốc tế, cạnh tranh Mỹ–Trung, ASEAN, Biển Đông, xung đột & an ninh, bầu cử lớn,
      trừng phạt, chính sách công nghiệp có tính địa chính trị.
    keywords: [Quốc hội, Bộ Chính trị, nghị định, luật, Mỹ, Trung Quốc, ASEAN, Biển Đông, bầu cử, trừng phạt, sanctions]

