claude:
  bin: claude              # đường dẫn Claude Code CLI
  classify_model: haiku    # phân loại hàng loạt — rẻ & nhanh
  analyze_model: sonnet    # phân tích từng chủ đề, gom storyline
  synthesis_model: opus    # tổng hợp liên chủ đề vi mô ↔ vĩ mô
  deep_model: opus         # `fa deep` / `fa ask` (có WebSearch/WebFetch)
  batch_size: 30           # số bài mỗi lần gọi phân loại (lớn quá dễ bị model bỏ sót)
  concurrency: 4           # số lần gọi Claude song song
  timeout_minutes: 10

fetch:
  max_age_hours: 48        # bỏ bài cũ hơn
  max_items_per_feed: 60
  concurrency: 8
  timeout_seconds: 25

analyze:
  window_hours: 30         # cửa sổ tin cho bản tin ngày
  min_relevance: 0.5       # ngưỡng liên quan để vào phân tích
  max_articles_per_topic: 100
  storyline_memory_days: 10  # nhớ storyline cũ bao nhiêu ngày để nối mạch

report:
  dir: reports             # tương đối với FA_HOME
  copy_to: []              # vd: ["C:/Users/me/Documents/vault/News"] — chép bản tin .md sang Obsidian

web:
  addr: 127.0.0.1:8787     # địa chỉ cho `fa serve` / `fa open` (chỉ nghe localhost)

# Xuất bản công khai (fa publish) — Cloudflare, gói free.
# Thiết lập 1 lần: npx wrangler login. Sau đó: fa publish (hoặc after_daily: true).
publish:
  target: workers          # workers = Workers Static Assets (free, tự tạo domain + DNS + SSL) | pages = Cloudflare Pages
  project: fa-blog         # tên Worker / Pages project
  domain: ""               # custom domain trên Cloudflare, vd blog.example.com
  site_title: "Bản tin vi mô ↔ vĩ mô"
  description: "Bản tin AI agent, kinh tế, chính trị — Việt Nam & quốc tế — nối sự kiện vi mô với xu hướng vĩ mô, tạo tự động mỗi ngày."
  days: 90                 # xuất bản bản tin N ngày gần nhất (0 = tất cả)
  out_dir: site            # thư mục build (tương đối với FA_HOME)
  branch: main
  after_daily: false       # true = fa daily tự publish khi xong (dùng với fa schedule)
  exclude: []              # slug báo cáo deep / storyline KHÔNG công khai, vd [q-cau-hoi-rieng]
  include_security: false  # true = đưa bản đồ mối đe doạ (/security) lên site công khai (có mục stack dự án của bạn)

# Bản đồ mối đe doạ an ninh mạng (fa sec, fa open security). Dữ liệu: tin topic security (+ nội dung bài gốc),
# CISA KEV, điểm EPSS (FIRST), hoạt động leak site ransomware (RansomLook). Chạy kèm fa daily khi enabled.
security:
  enabled: true
  topic: security          # topic id ở trên
  extract_model: sonnet    # trích xuất sự cố, nhóm tấn công, lãnh thổ, ATT&CK, CVE từ từng bài
  brief_model: opus        # tổng hợp xu hướng + playbook phòng thủ cho dự án
  batch_size: 8            # số bài mỗi lần gọi trích xuất
  fulltext: true           # tải bài gốc để có chi tiết kỹ thuật (fallback: tóm tắt RSS)
  text_chars: 3500
  kev_url: "https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json"
  epss: true
  ransom_url: "https://www.ransomlook.io/api/last/{days}"   # rỗng = tắt
  backfill_days: 30        # fa sec backfill: lấy cả tin security cũ tới N ngày
  # Công nghệ trong các dự án của bạn — bản đồ đánh dấu sự cố/CVE chạm tới từng mục, playbook viết riêng cho từng mục.
  stack:
    - {name: PHP / Laravel,            match: [php, laravel, composer, wordpress, mod_php]}
    - {name: Node.js / npm / Next.js,  match: [node.js, nodejs, npm, next.js, nextjs, react, vite, javascript, typescript]}
    - {name: Python / PyPI / AI agent, match: [python, pypi, pip, litellm, langchain, openai sdk, httpx]}
    - {name: Go,                       match: [golang, go module, go crypto, crypto/x509, x/net, x/crypto, go toolchain]}
    - {name: Rust / Tauri,             match: [rust, crates.io, cargo, tauri]}
    - {name: Docker / container,       match: [docker, container image, container escape, containerd, runc, kubernetes, k8s, docker hub, ghcr]}
    - {name: "AWS (ECS, Lambda, RDS, S3, IAM)", match: [aws, amazon web services, s3, lambda, iam, ecs, rds, aurora, bedrock, cloudfront, ec2]}
    - {name: PostgreSQL / Redis-Valkey, match: [postgres, postgresql, redis, valkey]}
    - {name: GitHub / CI/CD,           match: [github, github actions, gitlab, ci/cd, ci runner, workflow, oauth device]}
    - {name: Cloudflare,               match: [cloudflare, wrangler]}
    - {name: Claude / MCP / AI coding agent, match: [claude, anthropic, mcp, ai agent, ai gateway, copilot, cursor, codex, prompt injection]}
    - {name: "SaaS identity (M365, Slack, OAuth)", match: [microsoft 365, m365, entra, azure ad, okta, slack, oauth, sso]}
    - {name: Máy dev Windows,          match: [windows, smartscreen, powershell, mshta, clickfix]}
