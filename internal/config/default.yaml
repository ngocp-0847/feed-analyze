claude:
  bin: claude              # đường dẫn Claude Code CLI
  classify_model: haiku    # phân loại hàng loạt — rẻ & nhanh
  analyze_model: sonnet    # phân tích từng chủ đề, gom storyline
  synthesis_model: opus    # tổng hợp liên chủ đề vi mô ↔ vĩ mô
  deep_model: opus         # `fa deep` / `fa ask` (có WebSearch/WebFetch)
  batch_size: 30           # số bài mỗi lần gọi phân loại (lớn quá dễ bị model bỏ sót)
  concurrency: 4           # số lần gọi Claude song song
  timeout_minutes: 10

fetch:
  max_age_hours: 48        # bỏ bài cũ hơn
  max_items_per_feed: 60
  concurrency: 8
  timeout_seconds: 25

analyze:
  window_hours: 30         # cửa sổ tin cho bản tin ngày
  min_relevance: 0.5       # ngưỡng liên quan để vào phân tích
  max_articles_per_topic: 100
  storyline_memory_days: 10  # nhớ storyline cũ bao nhiêu ngày để nối mạch

report:
  dir: reports             # tương đối với FA_HOME
  copy_to: []              # vd: ["C:/Users/me/Documents/vault/News"] — chép bản tin .md sang Obsidian

web:
  addr: 127.0.0.1:8787     # địa chỉ cho `fa serve` / `fa open` (chỉ nghe localhost)
